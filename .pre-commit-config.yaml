# .pre-commit-config.yaml --- QA Pipeline Local Gate
#
# 2 段構成。CI (GitHub Actions) はリモートゲート、これはローカルゲート。
#   pre-commit stage : 高速チェック (秘密情報 / shell lint / 空白・改行・JSON/YAML 整合)
#   pre-push  stage  : 重量チェック (lint / typecheck / unit test) ← push を止める本命
#
# インストール (2 stage 両方を入れる。片方だけだと pre-push が効かない):
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 手動実行:
#   pre-commit run --all-files                 # pre-commit stage のみ
#   pre-commit run --hook-stage pre-push -a    # pre-push stage を実行
#
# 背景: 本リポは Vercel/GitHub 無料プランのため branch protection (required status
# checks) を張れない。壊れたコードが main へ入るのをローカル pre-push で機械的に止める
# のが唯一の強制手段なので、この設定を外さないこと (J-2b / Setaka 承認 2026-08-08)。

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- main 直接書き込みガード (HARD) ---
  # GitHub 側の branch protection が free + private では課金ゲートされていて張れないため、
  # 「PR を経由させる」強制を手元で作る。DEPLOY_ENABLED=true の今、main への push は
  # 即 elxea.com への本番配信になるので、これを外さないこと。詳細は docs/ops/main-guard.md。
  - repo: local
    hooks:
      - id: main-guard-commit
        name: main への直接 commit を拒否
        entry: scripts/git-guard/main-guard.sh commit
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: main-guard-push
        name: main への直接 push を拒否
        entry: scripts/git-guard/main-guard.sh push
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # --- Secret Scan (HARD - same as CI) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # --- Shell Lint (HARD - same as CI) ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=error']

  # --- Trailing whitespace / EOF ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'package-lock\.json'
      - id: check-merge-conflict

  # --- pre-push gate (HARD): これを通らないと push できない ---
  # pass_filenames: false / always_run: true = 変更ファイルに関係なく毎回リポ全体を検査。
  # 部分実行だと「触っていないファイルが壊れている」状態を見逃すため。
  - repo: local
    hooks:
      - id: lint
        name: ESLint (--max-warnings 0)
        entry: pnpm lint
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: TypeScript typecheck (stale .next/types をクリアしてから実行)
        entry: pnpm typecheck
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: unit-test
        name: Unit test (vitest run)
        entry: pnpm test
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
