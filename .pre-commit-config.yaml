# .pre-commit-config.yaml --- QA Pipeline Local Gate
#
# 2 段構成。CI (GitHub Actions) はリモートゲート、これはローカルゲート。
#   pre-commit stage : 高速チェック (秘密情報 / shell lint / 空白・改行・JSON/YAML 整合)
#   pre-push  stage  : 重量チェック (lint / typecheck / unit test) ← push を止める本命
#
# インストール (2 stage 両方を入れる。片方だけだと pre-push が効かない):
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 手動実行:
#   pre-commit run --all-files                 # pre-commit stage のみ
#   pre-commit run --hook-stage pre-push -a    # pre-push stage を実行
#
# 背景 (訂正 2026-08-27): 元は「本リポは無料プランのため branch protection を張れず、
# ローカル pre-push が唯一の強制手段」と書いてあったが、これは現在は誤り。実測
# (gh api repos/elxea/elxea-web-app/branches/main/protection): リポジトリは public、
# main は required status checks 7 本 (static-checks / unit-tests / coverage / build /
# storybook-tests / e2e-tests / identity-e2e) で保護済み。赤ではマージできない。
#
# ではこのローカルゲートは不要かというと、そうではない。役割が「唯一の強制」から
# 「速い方の強制」に変わっただけで、CI を待たずに手元で同じ検査を落とせる価値は残る
# (CI 1 周は数分、ここは数十秒)。したがってこの設定は引き続き外さないこと
# (J-2b / Setaka 承認 2026-08-08、根拠の記述のみ 2026-08-27 に是正)。

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- Secret Scan (HARD - same as CI) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # --- Shell Lint (HARD - same as CI) ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=error']

  # --- Trailing whitespace / EOF ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'package-lock\.json'
      - id: check-merge-conflict

  # --- pre-push gate (HARD): これを通らないと push できない ---
  # pass_filenames: false / always_run: true = 変更ファイルに関係なく毎回リポ全体を検査。
  # 部分実行だと「触っていないファイルが壊れている」状態を見逃すため。
  - repo: local
    hooks:
      - id: lint
        name: ESLint (--max-warnings 0)
        entry: pnpm lint
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: TypeScript typecheck (stale .next/types をクリアしてから実行)
        entry: pnpm typecheck
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: unit-test
        name: Unit test (vitest run)
        entry: pnpm test
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
