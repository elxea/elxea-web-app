name = "elxea-checkout-router"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Account: setaka-on@elxea.com (elxea)
account_id = "1ffc231d9346f5e4e4110d4850b28a70"

# Route: all traffic on elxea.com
# DNS points to Vercel (76.76.21.21). Worker intercepts Shopify paths
# and proxies them to Shopify origin. All other paths pass through to Vercel.
routes = [
  { pattern = "elxea.com/*", zone_name = "elxea.com" },
  { pattern = "www.elxea.com/*", zone_name = "elxea.com" }
]

# Disable workers.dev in production
workers_dev = false

[vars]
SHOPIFY_ORIGIN = "https://elxea.myshopify.com"
