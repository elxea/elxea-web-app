name: branch-divergence

# P3: ブランチ乖離の定期監査 (可視化)
#
# origin の全未マージブランチについて main からの behind コミット数 / バッチ齢を
# 測り、warn(>20 or >3d) / stop(>50 or >7d) を集計して GitHub Actions のサマリに
# 出す。これは "見える化" であり、この workflow 自体はブロックしない
# (このリポには既に多数の legacy ブランチがあり、ここで fail させると常時赤に
# なって signal を失うため)。実際の停止 (作業を止める) は push ガード
# branch-push-guard.yml が担う。legacy ブランチ整理後に --fail-on-stop へ
# 切替可能。しきい値・運用は docs/ops/branch-divergence.md 参照。

on:
  schedule:
    # 毎日 00:20 UTC (JST 09:20)
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      self_test_exit_code:
        description: >-
          配線セルフテスト。値を入れると本物の監査ではなく「指定コードで終了する
          スタブ」を同じ `| tee` 経路で走らせる。step が本当に赤くなるか (終了
          コードが tee に吸われていないか) を実測するための口。空なら通常の監査。
        required: false
        default: ""

concurrency:
  group: branch-divergence
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: audit-branch-divergence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit branch divergence
        id: audit
        # `shell: bash` は GitHub 既定の `bash -e {0}` と違い
        # `bash --noprofile --norc -eo pipefail {0}` で起動する。既定シェルには
        # pipefail が無いため、`node ... | tee` ではスクリプトの終了コードが tee の
        # 終了コード (常に 0) に吸われ、監査スクリプトがクラッシュしても step は
        # 緑のままだった (= 何も見ていないのに緑)。明示 shell + `set -euo pipefail`
        # の二重で塞ぐ。PR #80 (prod-main-sync.yml) と同じ手法。
        #
        # 注意: この workflow は「可視化」であり乖離そのものでは fail させない
        # (--fail-on-stop を渡していない)。ここで捕まえたいのは *スクリプトの異常終了*
        # であって、乖離の検出ではない。
        shell: bash
        env:
          SELF_TEST_EXIT_CODE: ${{ inputs.self_test_exit_code }}
        run: |
          set -euo pipefail
          if [ -n "${SELF_TEST_EXIT_CODE:-}" ]; then
            echo "::warning::self-test mode: 監査をスタブに差し替え exit ${SELF_TEST_EXIT_CODE} を模擬します (本番監査は実行されません)"
            node -e 'const c=Number(process.env.SELF_TEST_EXIT_CODE);console.log(JSON.stringify({selfTest:true,simulatedExitCode:c},null,2));process.exit(c)' | tee divergence.json
          else
            node scripts/ops/check-branch-divergence.mjs | tee divergence.json
          fi

      - name: Annotate and summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync("divergence.json","utf8")); }
            catch (e) {
              // レポートが無い / 壊れている = 監査が成立していない。
              // 以前はここで exit 0 していたため「何も見ていないのに緑」だった。
              console.log("::error title=divergence report missing::divergence.json を読めませんでした (" + e.message + ")。監査は成立していません");
              process.exit(1);
            }
            if (j.selfTest) { console.log("self-test report; skipping summary"); process.exit(0); }
            if (!j.counts || !Array.isArray(j.branches)) {
              console.log("::error title=divergence report malformed::counts / branches が無い形の JSON でした。監査は成立していません");
              process.exit(1);
            }
            const lines = ["## branch divergence audit",
              `total unmerged: ${j.counts.total} / warn: ${j.counts.warn} / stop: ${j.counts.stop}`,
              "", "| level | branch | behind | ahead | ageDays |", "|---|---|---|---|---|"];
            for (const b of j.branches) {
              lines.push(`| ${b.level} | ${b.branch} | ${b.behind} | ${b.ahead} | ${b.ageDays} |`);
              if (b.level === "stop") console.log(`::warning title=STOP branch::${b.branch} behind=${b.behind} age=${b.ageDays}d`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
