name: prod-main-sync

# P2 / 追加(a): 本番(Vercel) と main の一致監視 (認識割れの検知)
#
# 本番の正本は main (docs/ops/production-source-of-truth.md)。この workflow は
# Vercel の本番デプロイに付いた git SHA (deploy.yml の --meta) を読み、
# origin/main HEAD と一致するかを照合する。
#
# これは検知 (detection) であって強制ではない。ズレたら runbook に従い
# 24h 以内に是正する運用で担保する。ここではズレたら CI を失敗させ、
# GitHub Actions のサマリに理由を出す (通知の起点)。

on:
  schedule:
    # 毎日 00:10 / 12:10 UTC (JST 09:10 / 21:10) の 2 回照合
    - cron: "10 0,12 * * *"
  workflow_dispatch:
    inputs:
      self_test_exit_code:
        description: >-
          配線セルフテスト。値を入れると本物の監視ではなく「指定コードで終了する
          スタブ」を同じ `| tee` 経路で走らせる。step が本当に赤くなるか (終了
          コードが tee に吸われていないか) を実測するための口。空なら通常の監視。
        required: false
        default: ""

concurrency:
  group: prod-main-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check-prod-main-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # VERCEL_ORG_ID / VERCEL_PROJECT_ID は秘密ではない (deploy.yml と同値)
      VERCEL_ORG_ID: team_6ut7roUVtRU2EGbPVR9DNTy6
      VERCEL_PROJECT_ID: prj_sVwjaJwPAKxRcKu3wVejiqGPt5o6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the monitor can resolve the production commit SHA and
          # compute whether main is ahead only by deploy-ignored paths (docs).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check prod ↔ main sync
        id: check
        # `shell: bash` は GitHub 既定の `bash -e {0}` と違い
        # `bash --noprofile --norc -eo pipefail {0}` で起動する。既定シェルには
        # pipefail が無いため、`node ... | tee` ではスクリプトの終了コードが tee の
        # 終了コード (常に 0) に吸われ、ドリフト検知が「緑のまま」握り潰されていた。
        # 明示 shell + `set -euo pipefail` の二重で塞ぐ。
        shell: bash
        env:
          SELF_TEST_EXIT_CODE: ${{ inputs.self_test_exit_code }}
        run: |
          set -euo pipefail
          if [ -n "${SELF_TEST_EXIT_CODE:-}" ]; then
            echo "::warning::self-test mode: monitor をスタブに差し替え exit ${SELF_TEST_EXIT_CODE} を模擬します (本番監視は実行されません)"
            node -e 'const c=Number(process.env.SELF_TEST_EXIT_CODE);console.log(JSON.stringify({selfTest:true,simulatedExitCode:c},null,2));process.exit(c)' | tee sync-report.json
          else
            node scripts/ops/check-prod-main-sync.mjs --fail-on-drift | tee sync-report.json
          fi

      - name: Summarize
        if: always()
        run: |
          {
            echo "## prod ↔ main sync"
            echo '```json'
            cat sync-report.json 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
