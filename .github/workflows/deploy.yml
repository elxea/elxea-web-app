name: Deploy Production

# Free-plan Vercel auto-deploy.
#
# Why this exists: the elxea-web-app repo lives under a GitHub org, and Vercel's
# native Git integration for org-owned private repos requires a paid plan. The
# owner has decided to stay on the Vercel free plan. The free path is the Vercel
# CLI, which deploys fine on the free tier. So instead of Vercel's Git
# integration we trigger the official Vercel CLI flow from GitHub Actions on
# every push to main:
#   vercel pull  -> vercel build --prod  -> vercel deploy --prebuilt --prod
#
# This uses the official Vercel CLI directly (no third-party marketplace action)
# per Vercel's documented GitHub Actions recipe.

on:
  # Manual re-run. Deploys are not always reproducible from a code change (a
  # Vercel-side or CLI-side failure can break a deploy with no repo change at
  # all — see VERCEL_CLI_VERSION below), so we must be able to retry a deploy
  # without pushing a dummy commit. workflow_dispatch also ignores the
  # paths-ignore filter below, which is what we want for a forced redeploy.
  workflow_dispatch:
  push:
    branches: [main]
    # Skip deploys for docs-only pushes: if EVERY changed file matches these
    # globs, the workflow does not run (no point rebuilding/redeploying the app
    # for a README or Markdown-only change). A push that also touches app code
    # still deploys normally.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Serialize deploys: never let two main pushes deploy concurrently. We do NOT
# cancel an in-progress deploy (cancel-in-progress: false) — a half-finished
# `vercel deploy` should be allowed to complete rather than be aborted midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Match the Vercel project's runtime (nodeVersion 24.x in .vercel/project.json)
  # so the local `vercel build` compiles under the same major as production and
  # avoids build-vs-runtime skew.
  NODE_VERSION: "24"
  # VERCEL_ORG_ID / VERCEL_PROJECT_ID are NOT secrets — they are the team and
  # project identifiers from .vercel/project.json (which is git-ignored, so we
  # pin them here). The Vercel CLI reads these env vars automatically for
  # pull/build/deploy, removing the need for an interactive `vercel link`.
  VERCEL_ORG_ID: team_6ut7roUVtRU2EGbPVR9DNTy6
  VERCEL_PROJECT_ID: prj_sVwjaJwPAKxRcKu3wVejiqGPt5o6
  # Pinned deliberately. This used to be `vercel@latest`, which meant a
  # third-party patch release could break production deploys with zero changes
  # in this repo — and on 2026-07-30 exactly that happened (57.0.0 deployed
  # fine, 58.4.4 did not; see .vercelignore for the mechanism). Deploys must be
  # reproducible, so the CLI is a pinned input like any other dependency.
  # Bump intentionally, and check the run stays green after you do.
  VERCEL_CLI_VERSION: "58.9.4"
  # Public production URL, asserted by the smoke check after every deploy.
  PRODUCTION_URL: "https://elxea.com"

jobs:
  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The token is provided ONCE here as an env var. The Vercel CLI reads
    # VERCEL_TOKEN from the environment automatically, so no step passes it as a
    # `--token=` command-line flag. Env-passing shrinks the exposure surface:
    # the value never appears in a rendered command line (which can surface in
    # process listings / step logs) — GitHub also masks it, but not putting it
    # on argv is defense in depth.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Preflight — require VERCEL_TOKEN secret
        # Fail loudly (not silently) when the deploy token is missing. Without
        # this guard, `vercel pull` would fail deep in the run with an opaque
        # auth error. Here we stop first with an actionable message pointing at
        # exactly what the owner must do.
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error title=VERCEL_TOKEN not set::The 'VERCEL_TOKEN' repository secret is missing, so this deploy cannot authenticate to Vercel."
            echo "To enable deploys:"
            echo "  1. Create a PROJECT-SCOPED token at https://vercel.com/account/tokens (scope it to the elxea-web-app project only)"
            echo "  2. Run: gh secret set VERCEL_TOKEN --repo <owner>/elxea-web-app"
            echo "Until then this workflow will intentionally fail on every push to main."
            exit 1
          fi
          echo "VERCEL_TOKEN is present. Proceeding."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production

      - name: Build project artifacts (production)
        run: vercel build --prod

      - name: Deploy prebuilt artifacts to production
        id: deploy
        # `vercel deploy` writes the deployment URL to stdout and its progress
        # to stderr, so capturing stdout yields exactly the deployment this run
        # created. We keep it for the smoke check and the run summary.
        run: |
          # --meta attaches the source git SHA + ref to the Vercel deployment.
          # A `--prebuilt` CLI deploy carries NO git metadata by default, so the
          # prod↔main sync monitor (scripts/ops/check-prod-main-sync.mjs, P2)
          # had no way to learn "which commit is live". These meta keys give it
          # that: the monitor reads meta.githubCommitSha from the Vercel REST
          # API and compares it to origin/main HEAD.
          deployment_url="$(vercel deploy --prebuilt --prod \
            --meta githubCommitSha="${GITHUB_SHA}" \
            --meta githubCommitRef="${GITHUB_REF_NAME}")"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${deployment_url}"

      - name: Smoke check — production must actually serve traffic
        # A green `vercel deploy` is not proof the site works. The 2026-07-31
        # outage was the reverse case (deploy failed loudly), but the same
        # underlying defect — files silently missing from the uploaded
        # deployment — can also produce a "successful" deploy that serves
        # errors. So we assert the production domain really returns 200 before
        # calling this workflow successful.
        #
        # This does NOT roll back; it only reports. Rolling back automatically
        # would be a riskier action to take unattended, and Vercel keeps the
        # previous deployment available for an instant manual rollback.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          echo "Deployment: ${DEPLOYMENT_URL}"
          code=000
          # Retry: alias propagation is not instant, and a single transient
          # network blip should not fail an otherwise good deploy.
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "${PRODUCTION_URL}" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "${PRODUCTION_URL} returned 200 on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: ${PRODUCTION_URL} returned HTTP ${code}; retrying in 10s..."
            sleep 10
          done
          echo "::error title=Production smoke check failed::${PRODUCTION_URL} did not return 200 after 5 attempts (last: HTTP ${code}). The deploy may have shipped a broken build — check ${DEPLOYMENT_URL} and consider rolling back in the Vercel dashboard."
          exit 1
