name: monitor-line-prod

# LINE 連携・ログインの本番監視。
#
# ## なぜ居るのか
#
# LINE 連携は「本物の LINE」としか結合できない。偽 LINE を立てた E2E
# (e2e/line-linkage-flow.spec.ts、required check の identity-e2e) が守れるのは
# 自分たちのコードの筋道までで、**本物との境界** — チャネルの鍵・redirect_uri の
# 登録・LINE 側の仕様変更 — は本番でしか壊れない。
#
# テスト用の個人 LINE アカウントは持たない方針 (Setaka 決定 2026-08-23)。
# その境界は本 workflow の「本番ログ監視 + ヘルスプローブ」で守る。
#
# 実在した壊れ方: 2026-08-22、Channel Secret 保存時に紛れ込んだ末尾改行 1 文字で
# token 交換が毎回 400 invalid_client になった。コードは無傷で CI も E2E も緑。
# こういう壊れ方はログにしか出ない。
#
# ## 検知の二本立て (片方だけにしないこと)
#
#   1. ログ検知      … 実際に落ちた人がいた痕跡を拾う。Vercel の保持期間に依存する。
#   2. ヘルスプローブ … 誰も踏まなくても設定破壊そのものを拾う。保持期間に依存しない。
#
# 2 が 1 の穴 (誰も踏まない時間帯・ログが消えた区間) を埋める。
#
# ## 実行間隔がなぜ 30 分なのか (変える前に読むこと)
#
# この Vercel プロジェクトは Hobby (無料) プランで、Runtime Logs の保持は
# **1 時間**しかない (https://vercel.com/docs/logs/runtime)。Log Drains は Pro 以上
# (https://vercel.com/docs/drains) なので無料のまま外へ流し続けることもできない。
#
# よって「6 時間ごと」は成立しない — 5 時間分は取得時点で既に消えている。
# 30 分ごとに走らせ、取得窓は 65 分 (窓 > 間隔) にして重ねてある。GitHub の cron は
# 数十分遅れて起動することがあるため、その遅延を窓の重なりで吸収する。
#
# 取りこぼしは原理的にゼロにはならない: schedule が 60 分以上遅れた区間のログは
# Vercel 側から既に消えている。ログ検知は best-effort であり、そこを埋めるのが
# 毎回必ず走るヘルスプローブ。恒久的に埋めたいなら Vercel Pro (保持 1 日) か
# Log Drain (Pro 以上) が要る — どちらも課金。
#
# ## 課金
#
# このリポジトリは public なので標準 runner の Actions 分数は無料。
# 30 分ごと = 月 1440 run、1 run あたり 1 分強で請求分数は 0。
# private 化する場合はこの cron を見直すこと (無料枠 2000 分/月を超える)。

on:
  schedule:
    # 30 分ごと。上の「実行間隔がなぜ 30 分なのか」を読まずに広げないこと。
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "遡る時間窓 (例: 65m, 1h)。Hobby プランの保持上限は 1 時間"
        type: string
        default: "65m"
      skip_logs:
        description: "ログ取得を省略しヘルスプローブだけ実行する"
        type: boolean
        default: false
      self_test:
        description: "合成の検知を 1 件混ぜて通知経路 (Issue 起票) の疎通を確かめる"
        type: boolean
        default: false

concurrency:
  # 監視同士が重なっても得るものが無い。走っている run は落とさない。
  group: monitor-line-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      summary: ${{ steps.run.outputs.summary }}
      detail: ${{ steps.run.outputs.detail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 依存は入れない。監視は Node の標準ライブラリ + npx 経由の vercel CLI だけで
      # 動く (pnpm install を挟むと、依存が壊れた日に監視まで止まる)。
      - name: Run monitor
        id: run
        env:
          # 値は GitHub Secrets にのみ存在する。ここには名前しか書かない。
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail

          ARGS="--since ${{ inputs.since || '65m' }} --limit 2000"
          if [ "${{ inputs.skip_logs }}" = "true" ]; then
            ARGS="$ARGS --skip-logs"
          fi
          if [ "${{ inputs.self_test }}" = "true" ]; then
            ARGS="$ARGS --self-test"
          fi

          echo "Running: node scripts/ops/monitor-line-prod.mjs $ARGS"

          # 終了コードは 0 異常なし / 1 検知 / 2 監視自体の失敗。
          # ここでは落とさずに受け取り、通知したうえで最後に落とす。
          set +e
          node scripts/ops/monitor-line-prod.mjs $ARGS
          CODE=$?
          set -e

          echo "exit code: $CODE"
          exit $CODE

  notify:
    name: notify
    needs: monitor
    # 検知 (exit 1) と監視自体の失敗 (exit 2) の両方でここに来る。
    # 「異常なし」では通知しない — 鳴らないことが常態の監視で毎回鳴らすと、
    # 本当に鳴った日に読まれなくなる。
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # tracking issue を open / 追記するために必要。
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ needs.monitor.outputs.outcome }}
          SUMMARY: ${{ needs.monitor.outputs.summary }}
          DETAIL: ${{ needs.monitor.outputs.detail }}
        with:
          script: |
            const label = "line-link-alert";
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const outcome = process.env.OUTCOME || "unknown";
            const summary = process.env.SUMMARY || "(要約なし)";
            const detail = process.env.DETAIL || "(詳細なし)";

            // ラベルが無ければ作る (初回実行時)。
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "d73a4a",
                description: "LINE 連携・ログインの本番監視アラート",
              });
            }

            // 同じラベルの open issue に追記して連続検知を 1 本に集約する。
            // 既に open があれば新規は立てない (同じ障害で issue が量産されると、
            // 何件起きているのかも、いつ直ったのかも読めなくなる)。
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: label,
              state: "open",
              per_page: 1,
            });

            const body =
              `- outcome: \`${outcome}\`\n` +
              `- ${summary}\n\n` +
              `${detail}\n\n` +
              `- run: ${runUrl}\n` +
              `- at: ${new Date().toISOString()}`;

            if (open.length > 0) {
              const issue = open[0].number;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue,
                body: `LINE 本番監視が再度検知しました。\n\n${body}`,
              });
              core.notice(`Appended detection to issue #${issue}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: "LINE 連携・ログインの本番監視が異常を検知しています",
                labels: [label],
                body:
                  `LINE 連携・ログインの本番監視が異常を検知しました。連続検知はこの issue に ` +
                  `追記されます。\n\n` +
                  `outcome の読み方: \`detected\` = ログ/プローブが異常を捉えた / ` +
                  `\`fatal\` = 監視自体が回らなかった (= 判断材料が無い。異常なしではない)。\n\n` +
                  `${body}`,
              });
              core.notice(`Opened issue #${created.number}`);
            }
