name: CI

# Trigger design (2026-08-09, P0 of the QA plan).
#
# The problem this fixes: triggers were `main` / `developer` / `PR to main` only,
# so `feat/**` — where all the actual work happens — never ran CI at all. The
# C1 design-system branch reached 151 commits ahead of main without a single run.
# CI existed and looked healthy; it just wasn't pointed at the code being written.
#
# `feat/**` now runs a lean gate on every push. Heavy jobs (Chromatic) stay on
# PRs, because they cost more than they return on a work-in-progress branch.
#
# There is no branch protection on this repo (GitHub Free + private = required
# status checks are a paid feature; `gh api .../branches/main/protection` returns
# 403 "Upgrade to GitHub Pro"). So CI here *inspects and reports* — it cannot
# block a merge. Enforcement is the operational rule in docs/ci-gates.md: Boss
# confirms CI green before merging.
on:
  push:
    branches: [main, developer, "feat/**"]
    # Docs-only pushes cannot break any of these gates, and ~21% of this branch's
    # commits are fidelity-table markdown. Skipping them keeps the Actions budget
    # for pushes that can actually regress something. PRs are deliberately NOT
    # filtered — a PR gets the full suite regardless of what it touches.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # No `branches:` filter — every PR is checked, whatever its base.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs everywhere EXCEPT the auto-deploy branch.
  #
  # Since 2026-08-12 the production deploy is a job in THIS workflow (see
  # `deploy-production` at the bottom), so a workflow-level cancel would abort a
  # `vercel deploy` mid-flight — exactly what the old deploy.yml avoided with its
  # own `cancel-in-progress: false`. A job-level `concurrency:` cannot save it:
  # workflow-level cancellation kills the whole run regardless. So the guard has
  # to live here.
  #
  # Effect: on the deploy branch runs QUEUE instead of cancelling (FIFO, so the
  # newest commit still ends up as the final production deploy). Every other
  # branch keeps the old cheap cancel-the-stale-run behaviour.
  # 出荷ブランチ (= 本番の正本 main) の run はキャンセルしない。2026-08-17 の
  # 一本化で feat/c1-ds-foundation から main へ変更。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  # NOT a credential — a throwaway string that only has to be non-empty.
  # `lib/shopify/customer.ts` throws at module load when this is unset (unless
  # NODE_ENV=test), and it is only ever used as a sha256 input for token
  # encryption at runtime. Nothing in CI signs or verifies anything with it, and
  # the real value lives in the Vercel project env.
  #
  # Needed by two jobs for different reasons:
  #  - build: `next build` aborts at "Collecting page data" on /api/auth/logout.
  #  - e2e-tests: the Playwright `webServer` runs `pnpm dev`, which inherits
  #    process.env; without this every route 500s and the suite fails wholesale
  #    (41 failures traced to this single cause on run 31321859910).
  SESSION_SECRET: ci-build-only-placeholder-not-a-secret

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        # `pnpm typecheck`, not a bare `pnpm tsc --noEmit`. The script is
        # `typecheck:clean && next typegen && tsc --noEmit`: without the
        # `next typegen` step, the generated route types under .next/types are
        # missing, so any type error involving a generated PageProps / route type
        # was invisible to CI while the pre-push hook (which does run the script)
        # caught it locally. CI and pre-push now check the same thing.
        run: pnpm typecheck

      - name: Validate design tokens
        # Fails the build (validate-tokens.ts exits 1) when tokens drift from
        # the Style Dictionary source. Previously defined as a script but never
        # wired into CI.
        run: pnpm validate:tokens

      - name: Validate design-map
        # Fails the build (validate-design-map.ts exits 1) when the Figma node ⇄
        # code path table (scripts/design-system/design-map.json) has a bad shape
        # or a code_path that no longer exists on disk. Static-only here (no Figma
        # token in CI); the --figma node-existence freshness check runs weekly in
        # ~/.config/admin-pipeline/scripts/drift-audit-design.sh 検査④.
        run: pnpm validate:design-map

      - name: Validate design-kit
        # Fails the build (validate-design-kit.ts exits 1) when the generated
        # design-kit no longer reproduces from code — i.e. someone changed
        # tokens/*.json, sd.config.mjs, app/globals.css or components/ui/*.tsx
        # without re-running `pnpm generate:design-kit`. The kit used to be
        # hand-written and silently drifted; this is what makes drift a build
        # failure instead of a discovery months later.
        run: pnpm validate:design-kit

  unit-tests:
    name: unit-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --project unit --reporter=junit --outputFile=test-results/junit.xml

      - name: Verify unit test floor (P5 — 空回り検知)
        # A green run with ~0 tests is the "検証停止" failure mode from the
        # 2026-08 incident. Assert a minimum executed count so a silently empty
        # or over-filtered run FAILS instead of passing vacuously.
        # Raise TEST_FLOOR_UNIT toward the real count over time.
        # docs/ops/test-floor.md
        #
        # 移植元: main #58 (e1b778b)。一本化 (2026-08-17) で ci.yml をデプロイ配線の
        # 正本に統一する際、c1-ds 側の ci.yml にこの step が無かったため戻した。
        env:
          TEST_FLOOR_UNIT: "150"
        run: node scripts/ops/check-test-floor.mjs --file test-results/junit.xml --min "${TEST_FLOOR_UNIT}" --label unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  coverage:
    name: coverage
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure coverage
        # `@vitest/coverage-v8` was in devDependencies but nothing ever ran it, so
        # the untested surface (36 of 38 API routes, most of lib/) was real but
        # invisible — nobody could see it shrinking. Fails when coverage drops
        # below the pinned baseline in vitest.config.ts.
        #
        # Uses `pnpm test:coverage` (VITEST_COVERAGE=1) rather than `--coverage`:
        # the CLI flag makes @chromatic-com/storybook's bundled chromatic CLI
        # parse argv, hit the boolean, and throw
        # `Cannot create property 'provider' on boolean 'true'`, which fails
        # config load before any test runs. See the comment in vitest.config.ts.
        run: pnpm test:coverage

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
                console.log("| Metric | % | Covered |");
                console.log("| --- | ---: | ---: |");
                for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
              '
            else
              echo "[WARN] coverage/coverage-summary.json not found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: build
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        # Previously CI never built. The first real build was `vercel build --prod`
        # in deploy.yml, i.e. *after* the merge to main — so a broken build was
        # discovered in production deploys rather than on the branch.
        #
        # `pnpm build` = `node sd.config.mjs && tsx scripts/check-placeholders.ts
        # && next build`, so this also exercises token generation and the
        # placeholder scan.
        run: pnpm build
        env:
          # Seeded preview data so the seeded routes render at real density
          # during prerender instead of collapsing to empty states.
          PREVIEW_SEED: "1"
          # Public (non-secret) Sanity coordinates, same values e2e-tests uses.
          NEXT_PUBLIC_SANITY_PROJECT_ID: 5s8ahx87
          NEXT_PUBLIC_SANITY_DATASET: production
          # SESSION_SECRET comes from the workflow-level `env` block.

  storybook-tests:
    name: storybook-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests (a11y + interaction)
        # Stories run as vitest browser tests. Accessibility violations FAIL
        # because .storybook/preview.ts sets a11y.test: "error".
        run: pnpm test --project storybook

  e2e-tests:
    name: e2e-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (with retries for flaky tests)
        # Reporters now come from playwright.config.ts (list + html + json +
        # junit). The old `--reporter=junit --output=test-results/e2e-junit.xml`
        # was silently broken: `--output` is the artifacts *directory*, not the
        # JUnit path, so the XML went to stdout and the uploaded artifact
        # contained no report.
        run: pnpm test:e2e --retries=2
        env:
          CI: true
          NEXT_PUBLIC_SANITY_PROJECT_ID: 5s8ahx87
          NEXT_PUBLIC_SANITY_DATASET: production
          # Seeded product catalogue for the dev server the Playwright webServer
          # starts. CI has no Shopify Storefront credentials, so every
          # product-backed route used to degrade to "商品を読み込めませんでした"
          # — which also made an unknown product slug answer 200 instead of 404
          # and turned a zero-hit search into an error message. This flag only
          # takes effect when the credentials are absent, so it can never mask a
          # real Shopify outage. See lib/preview-seed-storefront.ts.
          #
          # NOT `PREVIEW_SEED=1`: the master flag also injects a seeded *cart*,
          # which would break the cart empty-state specs.
          PREVIEW_SEED_STOREFRONT: "1"

      - name: Verify E2E test floor (P5 — 空回り検知)
        # Same 0件成功 guard for the e2e suite. In CI several specs are
        # intentionally ignored (external services), so the floor is set below
        # the CI-run count with margin. Raise TEST_FLOOR_E2E over time.
        # docs/ops/test-floor.md
        #
        # 移植元: main #58 (e1b778b)。JUnit の出力先は playwright.config.ts の
        # reporter 定義 (test-results/e2e-junit.xml) を読む。
        if: always()
        env:
          TEST_FLOOR_E2E: "15"
        run: node scripts/ops/check-test-floor.mjs --file test-results/e2e-junit.xml --min "${TEST_FLOOR_E2E}" --label e2e

      - name: Report skipped tests (no-op green visibility)
        # Runs even when the suite fails. 33 runtime skip guards mean a large part
        # of this job can pass without asserting anything (CRON_SECRET,
        # SHOPIFY_WEBHOOK_SECRET, Shopify SellingPlan fixtures are all absent in
        # CI). This publishes the count and the reasons to the job summary so the
        # gap is visible on every run.
        #
        # Deliberately does NOT fail the build and does NOT enable those tests —
        # switching them on requires provisioning secrets, which is a separate
        # decision (see docs/ci-gates.md for the list).
        if: always()
        run: pnpm report:e2e-skips

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    name: visual-regression
    # Runs on PRs AND on main pushes. Chromatic bills per snapshot, so it does
    # NOT run on every `feat/**` push (that would burn the quota on intermediate
    # states nobody reviews). But PR-only was also wrong: it made
    # `autoAcceptChanges: main` below unreachable, so no main push ever produced
    # a new baseline and every PR kept diffing against the last manually
    # accepted build — a permanently red gate (main #51 / issue #50).
    #
    # `main` is the only branch that defines the baseline, so it is the only
    # branch whose pushes need a Chromatic build.
    #
    # 移植元: main #51 (0e43663)。一本化 (2026-08-17) で c1-ds の PR-only 版に
    # 上書きされないよう main 腕を戻した。
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # exitZeroOnChanges: false — unreviewed visual changes now BLOCK the
          # PR check (previously true = visual diffs never failed).
          exitZeroOnChanges: false
          # autoAcceptChanges: `main` is KEPT intentionally: once a change lands on
          # main it becomes the new baseline automatically, so main pushes don't
          # require manual re-accept. The gate that matters is on PR branches,
          # where changes are NOT auto-accepted and must be reviewed.
          #
          # (Audit G5 cleanup 2026-07-13) The one-time `design/va-pilot` baseline
          # arm was removed: the full-site visual pilot has been squash-merged into
          # main (content verified identical in main), so the branch-limited
          # auto-accept is dead residue. Only `main` remains.
          # NOTE: the stale origin/design/va-pilot + origin/fix/typekit-js-embed
          # branches themselves are safe to delete (both fully in main) but that
          # remote deletion is pending owner action; tip SHAs are in the PR body.
          autoAcceptChanges: "main"
          onlyChanged: true

  staging-smoke:
    name: staging-smoke
    # 出荷しているブランチを見る。ここが `main` に留まっていたため、この監視は
    # **一度も走っていなかった**: main は出荷ブランチより ~205 commit 遅れていて
    # push が来ないので、ref が一致せず毎回 skip されていた (下の
    # deploy-production が DEPLOY_BRANCH で直したのと同じ誤り)。デプロイ判定
    # (DEPLOY_ENABLED) には触らない — これは監視の対象を実際に出荷する側へ
    # 向け直すだけ。
    #
    # !! 出荷ブランチ (ship-gate の DEPLOY_BRANCH) を変えるときは、この行も
    #    一緒に変える。!!
    # 2026-08-17: 一本化で出荷ブランチが main になったため main に合わせた。
    #
    # 2026-08-18: `STAGING_URL` 未設定時の扱いを step 内の `exit 0` から
    # **job を skip** に変えた。旧実装は「Playwright を入れて何も検証せず緑」
    # を返すため、deploy-production と同じ「実行していないのに success」だった
    # (下の ship-gate のコメント参照)。skip なら一覧で灰色になり、監視が無い
    # ことが見て分かる。CI は赤くならない (失敗ではなく未設定なので)。
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.ship-gate.outputs.staging_configured == 'true'
    needs: [unit-tests, e2e-tests, ship-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging smoke tests
        # STAGING_URL が未設定のケースはこの job の `if:` (ship-gate 経由) で
        # 弾いているので、ここに来た時点で BASE_URL は必ず入っている。
        # 空のまま走ると spec が localhost:3000 に落ちて ERR_CONNECTION_REFUSED
        # で落ちるだけなので、保険として明示的に失敗させる (無言で 0 件成功に
        # しない)。
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error title=BASE_URL is empty::staging-smoke ran without STAGING_URL. The ship-gate condition and this job are out of sync."
            exit 1
          fi
          pnpm exec playwright test --config e2e/playwright-staging.config.ts
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          CI: true

  # ─────────────────────────────────────────────────────────────────────────
  # Ship gate — says, in the job list, whether anything actually ships
  # ─────────────────────────────────────────────────────────────────────────
  #
  # 2026-08-18: この job を新設した理由。
  #   `deploy-production` は「本番に出す/出さない」の判定を **step レベル**の
  #   ゲートで行っていた。判定が false のとき job は全 step を skip して 5 秒で
  #   **success (緑)** を返す。Actions の一覧では本当にデプロイした緑と区別が
  #   つかず、実際に「deploy-production が success = 本番反映済み」と誤読した
  #   事故が起きた (2026-08-18: 40f9615 は一度も Vercel に出ていないのに
  #   「本番反映完了」と報告された)。ログの `::notice` は読み飛ばされた。
  #
  # 直し方: 判定をこの独立 job に出し、`deploy-production` は
  # `needs.ship-gate.outputs.armed == 'true'` でのみ起動する。結果として
  #   - 未武装のとき `deploy-production` は **skipped (灰)** になり、緑と一目で
  #     区別できる (性質 1)
  #   - この job 自身は success のまま = CI は赤くならない (性質 2)
  #   - この job の **表示名** が「ARMED / NOT ARMED」を名乗り、さらに run 冒頭の
  #     Summary に同じ結論を書くので、ログを開かなくても分かる (性質 3)
  #   - 武装時は従来どおり deploy-production が起動し、中身は変えていない (性質 4)
  #
  # 「skip された job は needs グラフが壊れたのと見分けがつかない」という旧
  # コメントの懸念は、この job が常に走って理由を名乗ることで解消される
  # (deploy-production が灰 && ship-gate が「NOT ARMED」= 意図した不発、
  #  deploy-production が灰 && ship-gate も灰/赤 = 配線側の異常)。
  ship-gate:
    # 表示名がそのまま結論になる。`vars` は job name の式で使える (`secrets` は
    # 使えないので、staging 側の結論は Summary と skipped 表示で伝える)。
    # NOTE: 継続行は 1 行目と同じインデントに揃えること。深くすると YAML の
    # folded scalar が改行を保持してしまい、式が壊れる。
    name: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
      && (vars.DEPLOY_ENABLED == 'true'
      && 'ship-gate: ARMED — this run WILL deploy to production'
      || 'ship-gate: NOT ARMED — nothing is deployed (DEPLOY_ENABLED is not true)')
      || 'ship-gate: no deploy — not a push to main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
      staging_configured: ${{ steps.arm.outputs.staging_configured }}
    steps:
      - name: Decide what ships, and say so on the run summary
        # ── KILL SWITCH ────────────────────────────────────────────────────
        # 本番が動くのは、リポジトリ変数 DEPLOY_ENABLED がちょうど "true" の
        # ときだけ:
        #     gh variable set DEPLOY_ENABLED --body true   --repo <owner>/elxea-web-app
        #     gh variable set DEPLOY_ENABLED --body false  --repo <owner>/elxea-web-app
        #
        # 意図的に ENABLED (opt in) であって DISABLED (opt out) ではない。
        # DISABLED 方式だと、未設定・綴り間違い・うっかり削除がすべて「本番に
        # 出す」を意味してしまう。ENABLED ならそれら全部が「何もしない」になる。
        # 変数は現在 UNSET なので、この配線は不活性で着地し、最初の本番デプロイ
        # は必ず意図的な一手になる。
        #
        # ── DEPLOY_BRANCH ──────────────────────────────────────────────────
        # 出荷ブランチを決める行はここ 1 箇所だけ (`ci.yml` 内で他に持たない)。
        # 2026-08-17 の一本化で `feat/c1-ds-foundation` → `main`。
        # 本番の正本は main (docs/ops/production-source-of-truth.md)。
        # ここが「もう push されないブランチ」に留まると auto-deploy は無言で
        # 死ぬので、正本の宣言と必ず一致させること。
        id: arm
        env:
          # 値そのものは使わない。設定されているかどうかだけを見る。
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail

          is_prod_push=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_prod_push=true
          fi

          armed=false
          if [ "${is_prod_push}" = "true" ] && [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            armed=true
          fi

          staging_configured=false
          if [ -n "${STAGING_URL}" ]; then
            staging_configured=true
          fi

          echo "armed=${armed}" >> "$GITHUB_OUTPUT"
          echo "staging_configured=${staging_configured}" >> "$GITHUB_OUTPUT"

          # Run のトップページに出る要約。ログを開かなくても結論が読める。
          {
            echo "## Does this run ship anything?"
            echo
            if [ "${armed}" = "true" ]; then
              echo "- **Production deploy: ARMED** — \`deploy-production\` will run and deploy \`${GITHUB_SHA}\`."
            elif [ "${is_prod_push}" = "true" ]; then
              echo "- **Production deploy: NOT ARMED — NOTHING IS DEPLOYED.**"
              echo "  \`DEPLOY_ENABLED\` is not \`true\`, so \`deploy-production\` is **skipped**, not run."
              echo "  All gates passed; this commit is deployable. A green run here does **not** mean production changed."
              echo "  Enable with: \`gh variable set DEPLOY_ENABLED --body true\`"
            else
              echo "- **Production deploy: not applicable** — this is not a push to \`main\`, so nothing is deployed."
            fi
            if [ "${staging_configured}" = "true" ]; then
              echo "- **Staging smoke: configured** — \`staging-smoke\` will run against the staging URL."
            else
              echo "- **Staging smoke: NOT configured — NOT RUN.** The \`STAGING_URL\` secret is unset, so \`staging-smoke\` is **skipped**, not run. There is no staging verification on this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${armed}" != "true" ] && [ "${is_prod_push}" = "true" ]; then
            echo "::notice title=Nothing was deployed::DEPLOY_ENABLED is not 'true', so deploy-production is skipped and production is unchanged."
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Production deploy (moved here from .github/workflows/deploy.yml, 2026-08-12)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # deploy.yml had three independent defects; living in this workflow fixes all
  # three at once:
  #
  #  1. It shipped WITHOUT looking at a single test result — `on: push:
  #     branches: [main]`, no `needs:`, no gate, no `environment:`. The `needs:`
  #     below makes a green suite a hard precondition: if anything it depends on
  #     fails, this job never starts.
  #  2. It targeted `main`, which is ~205 commits BEHIND the branch that actually
  #     ships. A push to main therefore rolled production BACKWARDS — this really
  #     happened on 2026-08-12 and had to be manually recovered. See DEPLOY_BRANCH.
  #  3. It used `vercel build` + `vercel deploy --prebuilt`, broken since
  #     2026-07-31 (3 consecutive failures). Root cause in the deploy step below.
  #
  # Why `needs:` and not `workflow_run:`
  #   `workflow_run` "will only trigger a workflow run if the workflow file
  #   exists on the default branch", and the triggered run then executes in
  #   DEFAULT BRANCH context (GITHUB_SHA = last commit on the default branch).
  #   Both properties are fatal here: the gate would never fire for a `feat/**`
  #   push, and if it ever did it would deploy main's tip — re-creating defect 2.
  #   https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  #   `needs:` has neither problem: same workflow, same run, same commit, and
  #   ordering guaranteed by the dependency graph. (`workflow_dispatch` is out for
  #   the same default-branch reason, so there is no manual Actions deploy from a
  #   feature branch — manual deploys stay a local `vercel --prod`.)
  #
  # `visual-regression` is deliberately absent from `needs:` — it is PR-only, and
  # depending on a skipped job would skip this one too.
  deploy-production:
    name: deploy-production
    # 出荷ブランチ (DEPLOY_BRANCH) と武装スイッチ (DEPLOY_ENABLED) の判定は
    # `ship-gate` job に集約した。ここは「武装しているときだけ起動する」だけ。
    # 未武装なら **この job は起動せず skipped (灰) になる** ので、Actions の
    # 一覧で「デプロイした緑」と混同されない。判定を変えるときは ship-gate 側を
    # 触ること (このファイルで出荷ブランチを書いているのは ship-gate だけ)。
    if: needs.ship-gate.outputs.armed == 'true'
    needs: [static-checks, unit-tests, coverage, build, storybook-tests, e2e-tests, ship-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Second layer of serialisation, for the cross-workflow case: the workflow
    # concurrency group is per-ref, this one is global to the deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # NOT secrets — the team and project identifiers from .vercel/project.json,
      # which is git-ignored, hence pinned here. The Vercel CLI reads both from
      # the environment, so no interactive `vercel link` is needed.
      VERCEL_ORG_ID: team_6ut7roUVtRU2EGbPVR9DNTy6
      VERCEL_PROJECT_ID: prj_sVwjaJwPAKxRcKu3wVejiqGPt5o6
      # Pinned deliberately (移植元: main deploy.yml)。This used to be
      # `vercel@latest`, which meant a third-party patch release could break
      # production deploys with zero changes in this repo — and on 2026-07-30
      # exactly that happened (57.0.0 deployed fine, 58.4.4 did not). Deploys
      # must be reproducible, so the CLI is a pinned input like any other
      # dependency. Bump intentionally, and check the run stays green after you do.
      VERCEL_CLI_VERSION: "58.9.4"
      # Public production URL, asserted by the smoke check after every deploy.
      PRODUCTION_URL: "https://elxea.com"
      # Supplied ONCE, as an env var. The CLI picks VERCEL_TOKEN up automatically,
      # so no step passes it as a `--token=` flag: the value never lands on a
      # command line (which can surface in process listings and step logs).
      # GitHub masks it either way — keeping it off argv is defence in depth.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Preflight — require VERCEL_TOKEN secret
        # Fail loudly rather than deep inside the CLI with an opaque auth error.
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error title=VERCEL_TOKEN not set::The 'VERCEL_TOKEN' repository secret is missing, so this deploy cannot authenticate to Vercel."
            echo "To enable deploys:"
            echo "  1. Create a PROJECT-SCOPED token at https://vercel.com/account/tokens (scope it to the elxea-web-app project only)"
            echo "  2. Run: gh secret set VERCEL_TOKEN --repo <owner>/elxea-web-app"
            exit 1
          fi
          echo "VERCEL_TOKEN is present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Only needed to run the Vercel CLI itself. Note there is no pnpm setup
        # and no `pnpm install` in this job any more: the build happens on
        # Vercel's infrastructure now (see the deploy step), so the runner never
        # needs the dependency tree.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Verify Vercel credentials
        # Cheap auth probe that creates nothing. Deliberately `vercel whoami`
        # rather than the `vercel pull` the old workflow used: `pull` downloads
        # the production environment (including secret values) onto the runner's
        # disk, and now that Vercel does the building we have no use for it. Same
        # early-failure benefit, no secret materialised.
        run: vercel whoami

      - name: Deploy to production
        # Deploys FROM SOURCE. No `vercel build`, no `--prebuilt`.
        #
        # Why --prebuilt was removed (this is what broke on 2026-07-31/08-01/08-12):
        #   `vercel deploy --prebuilt` uploaded fine (1.7MB) and then failed on
        #   VERCEL's build machine while rehydrating the deployment:
        #     Downloading 391 deployment files...
        #     Error: ENOENT ... lstat '/vercel/path0/node_modules/.pnpm/@opentelemetry+api@1.9.1/.../context.js'
        #   391 files is far too few for a Next.js prebuilt output. Cause: the
        #   bare `node_modules` line in .vercelignore matches at ANY depth, so it
        #   also stripped `.vercel/output/functions/*.func/node_modules/**` — the
        #   dependencies Next.js had just traced into the functions. The upload
        #   shipped dangling references and Vercel failed resolving them.
        #   Note this means adding node_modules to .vercelignore is not the fix;
        #   it is already there and it IS the fault.
        #
        # Deploying from source sidesteps that interaction entirely: Vercel
        # installs and builds, and node_modules is correctly excluded from the
        # upload. Vercel also documents --prebuilt as the wrong choice when build
        # time needs System Environment Variables ("If you need System
        # Environment Variables at build time, do not use the --prebuilt flag"):
        #   https://vercel.com/docs/cli/deploy#when-not-to-use---prebuilt
        # Nothing is lost by not building here — the `build` job above already
        # fails this workflow before the deploy on any build break.
        id: deploy
        run: |
          # --meta attaches the source git SHA + ref to the Vercel deployment
          # (移植元: main #56 / 4c176dd)。A CLI deploy carries NO git metadata by
          # default, so the prod↔main sync monitor
          # (scripts/ops/check-prod-main-sync.mjs, P2) has no way to learn "which
          # commit is live". These two meta keys are its ONLY input: the monitor
          # reads meta.githubCommitSha from the Vercel REST API and compares it to
          # origin/main HEAD. Drop them and prod-main-sync.yml goes red every day.
          #
          # `vercel deploy` writes the deployment URL to stdout and progress to
          # stderr, so capturing stdout yields exactly this run's deployment.
          deployment_url="$(vercel deploy --prod \
            --meta githubCommitSha="${GITHUB_SHA}" \
            --meta githubCommitRef="${GITHUB_REF_NAME}")"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${deployment_url}"

      - name: Smoke check — production must actually serve traffic
        # A green `vercel deploy` is not proof the site works: the same class of
        # defect that made 2026-07-31 fail loudly (files missing from the
        # deployment) can also produce a "successful" deploy that serves errors.
        # So assert the production domain really returns 200 before calling this
        # job successful.
        #
        # 移植元: main deploy.yml。c1-ds 側の配線にはデプロイ後の 200 確認が無く、
        # 一本化でこれを落とすと「緑なのに本番が壊れている」を検知できなくなる。
        #
        # This does NOT roll back; it only reports. Rolling back unattended is a
        # riskier action, and Vercel keeps the previous deployment available for
        # an instant manual rollback.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          echo "Deployment: ${DEPLOYMENT_URL}"
          code=000
          # Retry: alias propagation is not instant, and a single transient
          # network blip should not fail an otherwise good deploy.
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 20 "${PRODUCTION_URL}" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "${PRODUCTION_URL} returned 200 on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: ${PRODUCTION_URL} returned HTTP ${code}; retrying in 10s..."
            sleep 10
          done
          echo "::error title=Production smoke check failed::${PRODUCTION_URL} did not return 200 after 5 attempts (last: HTTP ${code}). The deploy may have shipped a broken build — check ${DEPLOYMENT_URL} and consider rolling back in the Vercel dashboard."
          exit 1
