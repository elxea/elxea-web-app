name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Validate design tokens
        # Fails the build (validate-tokens.ts exits 1) when tokens drift from
        # the Style Dictionary source. Previously defined as a script but never
        # wired into CI.
        run: pnpm validate:tokens

      - name: Validate design-map
        # Fails the build (validate-design-map.ts exits 1) when the Figma node ⇄
        # code path table (scripts/design-system/design-map.json) has a bad shape
        # or a code_path that no longer exists on disk. Static-only here (no Figma
        # token in CI); the --figma node-existence freshness check runs weekly in
        # ~/.config/admin-pipeline/scripts/drift-audit-design.sh 検査④.
        run: pnpm validate:design-map

  unit-tests:
    name: unit-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --project unit --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  storybook-tests:
    name: storybook-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests (a11y + interaction)
        # Stories run as vitest browser tests. Accessibility violations FAIL
        # because .storybook/preview.ts sets a11y.test: "error".
        run: pnpm test --project storybook

  e2e-tests:
    name: e2e-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (with retries for flaky tests)
        run: pnpm test:e2e --retries=2 --reporter=junit --output=test-results/e2e-junit.xml
        env:
          CI: true
          NEXT_PUBLIC_SANITY_PROJECT_ID: 5s8ahx87
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    name: visual-regression
    if: github.event_name == 'pull_request'
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # exitZeroOnChanges: false — unreviewed visual changes now BLOCK the
          # PR check (previously true = visual diffs never failed).
          exitZeroOnChanges: false
          # autoAcceptChanges: `main` is KEPT intentionally: once a change lands on
          # main it becomes the new baseline automatically, so main pushes don't
          # require manual re-accept. The gate that matters is on PR branches,
          # where changes are NOT auto-accepted and must be reviewed.
          #
          # (Audit G5 cleanup 2026-07-13) The one-time `design/va-pilot` baseline
          # arm was removed: the full-site visual pilot has been squash-merged into
          # main (content verified identical in main), so the branch-limited
          # auto-accept is dead residue. Only `main` remains.
          # NOTE: the stale origin/design/va-pilot + origin/fix/typekit-js-embed
          # branches themselves are safe to delete (both fully in main) but that
          # remote deletion is pending owner action; tip SHAs are in the PR body.
          autoAcceptChanges: "main"
          onlyChanged: true

  staging-smoke:
    name: staging-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging smoke tests
        # Graceful skip when STAGING_URL secret is not configured.
        # Without this guard the spec falls through to its localhost:3000
        # default and the job fails every main push with ERR_CONNECTION_REFUSED
        # because the CI runner has no dev server. Once a dedicated staging
        # domain is provisioned, set `STAGING_URL` in repo secrets to enable.
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "STAGING_URL secret not configured — skipping staging smoke tests."
            exit 0
          fi
          pnpm exec playwright test --config e2e/playwright-staging.config.ts
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          CI: true
