name: sync-notion-to-sanity

# 記事同期 (Notion Content Hub → Sanity) のサーバー実行。
#
# これまで起動口は `pnpm sync:notion` の手動実行だけで、Setaka の Mac が起きて
# いないと記事が公開されなかった (launchd / jobs.json / vercel.json のどこにも
# 定時実行の登録が無い状態)。この workflow が唯一の定時実行の正本。
#
# ロジックは scripts/sync-notion-to-sanity.ts のまま (1236 行を書き換えていない)。
# サーバーで動かすために変えたのは設定値の受け取り方だけ:
#   - Sanity のトークン: ~/.config/sanity/config.json 直読み → SANITY_API_WRITE_TOKEN
#   - .env のファイル直読み → process.env (scripts/lib/sync-env.ts)
#
# 失敗の扱い (silent fail の解消):
#   - 実行結果は必ず Job Summary に残る (scripts/lib/sync-notify.ts)
#   - SLACK_WEBHOOK_URL があれば失敗時のみ Slack へ通知 (成功時は通知しない)
#   - 失敗が連続したら tracking issue を open / 追記する (下の notify job)
#
# 実行時間: 記事数十件規模で数分。timeout-minutes: 20 で上限に当たらない
# (GitHub の job 上限 6 時間 / 非公開リポの無料枠 月 2000 分に対して十分小さい)。

on:
  # 定時実行は一時停止中 (2026-08-18)。
  #
  # 理由: この workflow が必要とする secret (NOTION_API_KEY /
  # NOTION_CONTENT_HUB_DB_ID / NEXT_PUBLIC_SANITY_PROJECT_ID /
  # SANITY_API_WRITE_TOKEN) がリポジトリに未登録のため、毎時走っても必ず失敗し、
  # 失敗通知と tracking issue だけが積み上がる。本番サイトへの影響は無い
  # (この workflow はデプロイに関与しない) が、無意味な赤を出し続けないよう
  # cron を止めてある。
  #
  # 再開手順: 上記 4 つの secret を登録し、workflow_dispatch (dry_run: true) で
  # 1 回成功させてから、下の schedule ブロックのコメントを外す。
  #
  # schedule:
  #   # 毎時 5 分 (UTC)。Spec の完了基準「1 時間以内に出る」に合わせる。
  #   # cron の起動は数十分遅れることがある (GitHub の仕様) が、1 時間粒度の
  #   # 要件には収まる。
  #   - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sanity に書き込まず、取得と変換だけ検証する"
        type: boolean
        default: true
      target:
        description: "同期対象"
        type: choice
        default: articles
        options:
          - articles
          - pages
          # 茶譜 (Notion Tea Menu List → Sanity teaMenu)。記事と同じ起動口に
          # 相乗りさせている — 同種の同期を 2 つの workflow に分けると
          # secret・通知・失敗追跡がそれぞれ二重になる。
          - tea-menu
          - all
      dataset:
        description: "書き込み先 Sanity dataset (空なら secret の既定値)。本番前の検証用データセットを入れる用途"
        type: string
        default: ""

concurrency:
  # 同期は冪等 (createOrReplace) だが、同時実行は無駄なので直列化する。
  # 走っている run は落とさない (cancel-in-progress: false) — 途中で切ると
  # 一部だけ書き込まれた状態になる。
  group: sync-notion-to-sanity
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync
        id: run
        env:
          # 値は GitHub Secrets にのみ存在する。ここには名前しか書かない。
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CONTENT_HUB_DB_ID: ${{ secrets.NOTION_CONTENT_HUB_DB_ID }}
          NOTION_PAGE_REGISTRY_DB_ID: ${{ secrets.NOTION_PAGE_REGISTRY_DB_ID }}
          NOTION_PAGE_CONTENT_DB_ID: ${{ secrets.NOTION_PAGE_CONTENT_DB_ID }}
          # 未設定でも動く (スクリプト側に既定 id がある。秘密ではない)。
          # 差し替えたいときだけ secret を置く。
          NOTION_TEA_MENU_DB_ID: ${{ secrets.NOTION_TEA_MENU_DB_ID }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          # dispatch で dataset を指定したときだけ上書きする (検証用データセット)。
          NEXT_PUBLIC_SANITY_DATASET: ${{ inputs.dataset || secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_RESULT_PATH: ${{ runner.temp }}/sync-result.json
        run: |
          set -o pipefail

          # schedule 実行は常に本番同期 (dry-run ではない)。
          # workflow_dispatch は入力に従う。
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          case "${{ inputs.target || 'articles' }}" in
            pages)    ARGS="$ARGS --pages" ;;
            tea-menu) ARGS="$ARGS --tea-menu" ;;
            all)      ARGS="$ARGS --all" ;;
          esac

          echo "Running: pnpm tsx scripts/sync-notion-to-sanity.ts $ARGS"

          # スクリプトの終了コードは outcome を表す (0 成功 / 1 部分失敗 /
          # 2 入力取得失敗 / 3 設定不足 / 4 その他)。ここでは落とさずに
          # 受け取り、通知したうえで最後に落とす。
          set +e
          pnpm tsx scripts/sync-notion-to-sanity.ts $ARGS
          CODE=$?
          set -e

          RESULT="${{ runner.temp }}/sync-result.json"
          if [ -f "$RESULT" ]; then
            OUTCOME=$(node -e "process.stdout.write(require('$RESULT').outcome)")
            SUMMARY=$(node -e "
              const r = require('$RESULT');
              const f = r.failures?.length ? ' / 失敗: ' + r.failures.join(', ') : '';
              process.stdout.write(\`\${r.job}: 取得 \${r.fetched ?? '不明'} / 成功 \${r.synced} / 失敗 \${r.errors}\${f}\`);
            ")
          else
            # 結果ファイルが無いのは想定外 (通知の前に落ちた等)。
            # 「成功」と誤認しないよう明示的に異常扱いにする。
            OUTCOME="fatal"
            SUMMARY="結果ファイルが生成されなかった (exit code ${CODE})"
          fi

          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "exit code: $CODE / outcome: $OUTCOME"

          exit $CODE

  notify:
    name: notify-failure
    needs: sync
    # 失敗したときだけ走る。成功時は通知しない (Spec: 全件成功は通知しない)。
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # tracking issue を open / 追記するために必要。
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ needs.sync.outputs.outcome }}
          DETAIL: ${{ needs.sync.outputs.summary }}
        with:
          script: |
            const label = "sync-notion-to-sanity";
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const outcome = process.env.OUTCOME || "unknown";
            const detail = process.env.DETAIL || "(詳細なし)";

            // ラベルが無ければ作る (初回実行時)。
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "d73a4a",
                description: "記事同期 (Notion → Sanity) の失敗追跡",
              });
            }

            // 同じラベルの open issue に追記して連続失敗を 1 本に集約する。
            // これで「何回続けて失敗しているか」が issue 上で数えられる
            // (Spec: 3 回連続失敗で Issue DB に起票 — その判断材料になる)。
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: label,
              state: "open",
              per_page: 1,
            });

            const body =
              `- outcome: \`${outcome}\`\n` +
              `- ${detail}\n` +
              `- run: ${runUrl}\n` +
              `- at: ${new Date().toISOString()}`;

            if (open.length > 0) {
              const issue = open[0].number;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue,
                body: `記事同期が再度失敗しました。\n\n${body}`,
              });
              core.notice(`Appended failure to issue #${issue}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: "記事同期 (Notion → Sanity) が失敗しています",
                labels: [label],
                body:
                  `記事同期の定期実行が失敗しました。連続失敗はこの issue に追記されます ` +
                  `(3 回以上続いたら Notion の Issue DB に起票してください)。\n\n${body}`,
              });
              core.notice(`Opened issue #${created.number}`);
            }
