name: branch-push-guard

# P3: 乖離しすぎたブランチへの追加 push を CI で失敗させる (作業停止の機械強制)
#
# main から stop しきい値 (>50 commits behind または age >7 days) を超えたブランチに
# push すると、この workflow が失敗する。これ以上そのブランチに積み増すな = まず
# main を取り込む (merge/rebase) か、分割してマージせよ、という強制。259 コミット
# 乖離の再発を「積み増しの時点で」止める。
#
# push トリガーで発火する (PR トリガーだと push 時に発火しないため。review 指摘)。

on:
  push:
    branches-ignore:
      - main
      # backup/* は監査対象外 (docs/ops/branch-divergence.md)
      - "backup/**"
      # TEMPORARY (段階 B / 2026-08-18): 統合ブランチ本体だけを除外する。
      # ブランチ齢 10.7 日 > しきい値 7 日で level=stop になるが、齢は既存 commit の
      # committer date で決まり、history 書き換え (禁止) 以外に解消手段が無い。
      #
      # **段階 C で main へ合流させる直前に、この 1 行を削除する commit を積むこと。**
      # 合流後の main に残っていないことを
      #   grep -n "main-consolidation" .github/workflows/branch-push-guard.yml
      # で検証する。残したまま合流させると以後どの統合ブランチも無保護になる。
      - feat/main-consolidation-r2
      # G1 の TEMPORARY 除外 ("feat/main-consolidation") は 2026-08-18 に削除した。
      # 段階 A で main を統合ブランチへ取り込み終えたため、除外を残す理由が消えた
      # (残したまま main へ合流させると、以後どの統合ブランチも無保護になる)。
      # 以後は統合ブランチも他の全ブランチと同じくこのガードの対象になる。

concurrency:
  group: push-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: branch-divergence-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard — fail if pushed branch is too diverged
        run: |
          echo "Checking ${GITHUB_REF_NAME} against origin/main"
          node scripts/ops/check-branch-divergence.mjs --branch HEAD
