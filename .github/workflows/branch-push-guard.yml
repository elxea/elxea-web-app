name: branch-push-guard

# P3: 乖離しすぎたブランチへの追加 push を CI で失敗させる (作業停止の機械強制)
#
# main から stop しきい値 (>50 commits behind または age >7 days) を超えたブランチに
# push すると、この workflow が失敗する。これ以上そのブランチに積み増すな = まず
# main を取り込む (merge/rebase) か、分割してマージせよ、という強制。259 コミット
# 乖離の再発を「積み増しの時点で」止める。
#
# push トリガーで発火する (PR トリガーだと push 時に発火しないため。review 指摘)。

on:
  push:
    branches-ignore:
      - main
      # backup/* は監査対象外 (docs/ops/branch-divergence.md)
      - "backup/**"
      # TEMPORARY (2026-08-17, Setaka 承認済 / G1): main 一本化の統合ブランチ。
      # このガードは「乖離したブランチに積み増すな = まず main を取り込め」を強制
      # するもので、feat/main-consolidation はまさにその取り込みを行うブランチ。
      # main を取り込んでも既存 commit の committer date は変わらないので齢
      # (c1-ds 固有の最古 commit cd5cf34 = 2026-08-07 / しきい値 7 日超) は縮まず、
      # push が決定論的に赤になる。除外は**この 1 本だけ**で、他の全ブランチの
      # 保護は効いたまま。
      #
      # !! main へ合流させる直前に、この 1 行を削除する commit を積むこと。!!
      # 合流後の main に本行が残っていないことを検証チェックリストで確認する。
      - "feat/main-consolidation"

concurrency:
  group: push-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: branch-divergence-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard — fail if pushed branch is too diverged
        run: |
          echo "Checking ${GITHUB_REF_NAME} against origin/main"
          node scripts/ops/check-branch-divergence.mjs --branch HEAD
